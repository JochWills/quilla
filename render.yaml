# Render Blueprint for Quilla: two static sites from one repo.
#   quilla-landing → quilla.co.za (+ www redirect)   files in ./landing
#   quilla-app     → app.quilla.co.za                 files in ./app
# No build step: both sites are plain HTML/CSS/JS.
services:
  - type: web
    runtime: static
    name: quilla-landing
    buildCommand: echo "No build step"
    staticPublishPath: ./landing
    domains:
      - quilla.co.za
    buildFilter:
      paths:
        - landing/**
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /coming-soon
        destination: /coming-soon.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600

  - type: web
    runtime: static
    name: quilla-app
    buildCommand: echo "No build step"
    staticPublishPath: ./app
    domains:
      - app.quilla.co.za
    buildFilter:
      paths:
        - app/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Cache-Control
        value: no-cache
